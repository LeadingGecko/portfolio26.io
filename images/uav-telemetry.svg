<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="teleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="520" fill="url(#teleBg)"/>

  <!-- Header -->
  <rect x="25" y="20" width="850" height="475" rx="10" fill="none" stroke="rgba(56,189,248,0.3)" stroke-width="1.5"/>
  <text x="45" y="55" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" letter-spacing="2">GROUND STATION TELEMETRY // REAL-TIME BOUNDARY LAYER SOUNDING</text>
  <text x="850" y="55" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">● LINK ACTIVE (915 MHz)</text>
  <line x1="45" y1="68" x2="855" y2="68" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Left Chart: Altitude vs Temp Sounding (Skew-T profile) -->
  <g transform="translate(45, 90)">
    <rect width="480" height="340" rx="8" fill="rgba(15,23,42,0.75)" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="28" fill="#e2e8f0" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">ATMOSPHERIC SOUNDING (ALTITUDE vs TEMPERATURE / DEWPOINT)</text>
    
    <!-- Grid -->
    <g stroke="rgba(255,255,255,0.07)" stroke-width="1">
      <line x1="60" y1="50" x2="450" y2="50"/>
      <line x1="60" y1="110" x2="450" y2="110"/>
      <line x1="60" y1="170" x2="450" y2="170"/>
      <line x1="60" y1="230" x2="450" y2="230"/>
      <line x1="60" y1="290" x2="450" y2="290"/>
      <line x1="120" y1="50" x2="120" y2="290"/>
      <line x1="200" y1="50" x2="200" y2="290"/>
      <line x1="280" y1="50" x2="280" y2="290"/>
      <line x1="360" y1="50" x2="360" y2="290"/>
      <line x1="440" y1="50" x2="440" y2="290"/>
    </g>

    <!-- Y-axis labels (Altitude m AGL) -->
    <text x="50" y="54" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end">1200m</text>
    <text x="50" y="114" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end">900m</text>
    <text x="50" y="174" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end">600m</text>
    <text x="50" y="234" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end">300m</text>
    <text x="50" y="294" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end">0m (SFC)</text>

    <!-- X-axis labels (Temp °C) -->
    <text x="120" y="310" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">5°C</text>
    <text x="200" y="310" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">10°C</text>
    <text x="280" y="310" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">15°C</text>
    <text x="360" y="310" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">20°C</text>
    <text x="440" y="310" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">25°C</text>

    <!-- Profile Curves -->
    <!-- Environmental Temp Curve (Red/Amber) -->
    <path d="M 400 290 Q 360 210, 310 160 T 220 50" fill="none" stroke="#f43f5e" stroke-width="2.5"/>
    <!-- Dewpoint Curve (Cyan) -->
    <path d="M 330 290 Q 280 230, 240 170 T 160 50" fill="none" stroke="#00f0ff" stroke-width="2.5"/>

    <!-- Inversion layer highlight -->
    <rect x="60" y="150" width="390" height="25" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.3)" stroke-dasharray="4,2"/>
    <text x="440" y="166" fill="#fcd34d" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end">THERMAL INVERSION LAYER DETECTED (580m)</text>

    <!-- Legend -->
    <circle cx="80" cy="328" r="4" fill="#f43f5e"/>
    <text x="90" y="331" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9.5">Ambient Temp T</text>
    <circle cx="210" cy="328" r="4" fill="#00f0ff"/>
    <text x="220" y="331" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9.5">Dewpoint Td</text>
  </g>

  <!-- Right Telemetry Readouts -->
  <g transform="translate(545, 90)">
    <!-- Altitude & Climb Rate -->
    <rect width="305" height="75" rx="8" fill="rgba(15,23,42,0.8)" stroke="rgba(0,240,255,0.2)"/>
    <text x="18" y="26" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">ALTITUDE AGL (KALMAN)</text>
    <text x="18" y="58" fill="#00f0ff" font-family="'Space Grotesk', sans-serif" font-size="30" font-weight="700">624.8 <tspan font-size="16" fill="#94a3b8">m</tspan></text>
    <text x="210" y="42" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12">▲ +2.4 m/s</text>
    <text x="210" y="58" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9.5">Climb Rate</text>

    <!-- Barometric Pressure & Density Altitude -->
    <rect y="88" width="305" height="75" rx="8" fill="rgba(15,23,42,0.8)" stroke="rgba(16,185,129,0.2)"/>
    <text x="18" y="114" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">BAROMETRIC PRESSURE</text>
    <text x="18" y="146" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">943.12 <tspan font-size="15" fill="#94a3b8">hPa</tspan></text>
    <text x="210" y="130" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">D-ALT: 712m</text>
    <text x="210" y="146" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9.5">BMP390 ±0.03</text>

    <!-- Wind Vector & Velocity -->
    <rect y="176" width="305" height="75" rx="8" fill="rgba(15,23,42,0.8)" stroke="rgba(245,158,11,0.2)"/>
    <text x="18" y="202" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">WIND VECTOR (SONIC 2D)</text>
    <text x="18" y="234" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">6.8 <tspan font-size="15" fill="#94a3b8">m/s @ 245°</tspan></text>
    <text x="210" y="218" fill="#fcd34d" font-family="'JetBrains Mono', monospace" font-size="11">WSW GALE 8.1</text>
    <text x="210" y="234" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9.5">No Prop Interference</text>

    <!-- Air Quality PM2.5 / PM10 -->
    <rect y="265" width="305" height="75" rx="8" fill="rgba(15,23,42,0.8)" stroke="rgba(129,140,248,0.2)"/>
    <text x="18" y="291" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">BOUNDARY LAYER PARTICULATES</text>
    <text x="18" y="323" fill="#818cf8" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">11.4 <tspan font-size="15" fill="#94a3b8">µg/m³</tspan></text>
    <text x="210" y="307" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">AQI: GOOD (28)</text>
    <text x="210" y="323" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9.5">PM2.5 / PM10</text>
  </g>

  <!-- Bottom Mission Flight Stats -->
  <g transform="translate(45, 445)">
    <rect width="805" height="38" rx="6" fill="rgba(15,23,42,0.7)" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="24" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10.5">MISSION: <tspan fill="#38bdf8">VERT-PROFILE-04</tspan></text>
    <text x="220" y="24" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10.5">FLIGHT TIME: <tspan fill="#10b981">14m 32s</tspan></text>
    <text x="420" y="24" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10.5">BATTERY: <tspan fill="#34d399">15.2V (74%)</tspan></text>
    <text x="630" y="24" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10.5">LORA RSSI: <tspan fill="#00f0ff">-82 dBm</tspan></text>
  </g>
</svg>
