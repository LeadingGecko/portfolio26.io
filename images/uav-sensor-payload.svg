<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="podBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="sensorGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="900" height="520" fill="url(#podBg)"/>

  <!-- Technical grid pattern -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="65" x2="900" y2="65"/>
    <line x1="0" y1="130" x2="900" y2="130"/>
    <line x1="0" y1="195" x2="900" y2="195"/>
    <line x1="0" y1="260" x2="900" y2="260"/>
    <line x1="0" y1="325" x2="900" y2="325"/>
    <line x1="0" y1="390" x2="900" y2="390"/>
    <line x1="0" y1="455" x2="900" y2="455"/>
    <line x1="150" y1="0" x2="150" y2="520"/>
    <line x1="300" y1="0" x2="300" y2="520"/>
    <line x1="450" y1="0" x2="450" y2="520"/>
    <line x1="600" y1="0" x2="600" y2="520"/>
    <line x1="750" y1="0" x2="750" y2="520"/>
  </g>

  <!-- Header -->
  <rect x="30" y="25" width="840" height="470" rx="10" fill="none" stroke="rgba(16,185,129,0.3)" stroke-width="1.5"/>
  <text x="50" y="62" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" letter-spacing="2">PAYLOAD BAY &amp; SENSOR INTEGRATION CAD // CUTAWAY</text>
  <text x="850" y="62" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">CROSS-SECTION VIEW</text>
  <line x1="50" y1="75" x2="850" y2="75" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Drone Pod Cutaway Illustration -->
  <g transform="translate(100, 110)">
    <!-- Aerodynamic sampling pod shell -->
    <path d="M 80 160 C 80 80, 260 50, 480 50 C 580 50, 640 100, 660 160 C 640 220, 580 270, 480 270 C 260 270, 80 240, 80 160 Z" 
          fill="rgba(15,23,42,0.85)" stroke="#38bdf8" stroke-width="2.5"/>
    
    <!-- Air intake laminar flow vent -->
    <path d="M 40 140 L 90 140 L 90 180 L 40 180 Z" fill="rgba(0,240,255,0.2)" stroke="#00f0ff" stroke-width="2"/>
    <path d="M 20 150 L 35 150 M 15 160 L 38 160 M 20 170 L 35 170" stroke="#00f0ff" stroke-width="2"/>
    <text x="10" y="132" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="10">AIR INTAKE</text>

    <!-- Internal Flow Duct -->
    <path d="M 90 145 C 180 145, 240 120, 360 120 L 520 120 C 580 120, 620 145, 650 155" fill="none" stroke="rgba(56,189,248,0.5)" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- Sensor Pod Components inside -->
    <!-- 1. Temp/RH Chamber -->
    <rect x="180" y="95" width="70" height="50" rx="4" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="1.5"/>
    <text x="215" y="118" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" font-weight="700">SHT45</text>
    <text x="215" y="132" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">TEMP/RH</text>

    <!-- 2. Barometric Altitude Chamber -->
    <rect x="290" y="95" width="70" height="50" rx="4" fill="rgba(0,240,255,0.2)" stroke="#00f0ff" stroke-width="1.5"/>
    <text x="325" y="118" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" font-weight="700">BMP390</text>
    <text x="325" y="132" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">PRESSURE</text>

    <!-- 3. Optical Particulate Chamber -->
    <rect x="400" y="90" width="85" height="60" rx="4" fill="rgba(245,158,11,0.2)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="442" y="116" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" font-weight="700">OPTICAL PM</text>
    <text x="442" y="130" fill="#fcd34d" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">LASER DIODE</text>
    <line x1="410" y1="140" x2="475" y2="140" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,2"/>

    <!-- Main Board Compartment (Lower) -->
    <rect x="200" y="180" width="280" height="65" rx="5" fill="rgba(30,41,59,0.9)" stroke="#818cf8" stroke-width="1.5"/>
    <text x="220" y="205" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">CUSTOM SENSOR PCB &amp; STM32</text>
    <text x="220" y="222" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">Optoisolated Signal Conditioning · SPI/I2C/UART Shield</text>
    <circle cx="450" cy="212" r="6" fill="#818cf8"/>

    <!-- Exhaust Vent -->
    <path d="M 660 150 L 690 150 L 690 170 L 660 170 Z" fill="rgba(56,189,248,0.2)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="670" y="140" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9.5">OUTLET</text>

    <!-- Upper Mast: Ultrasonic Anemometer -->
    <line x1="340" y1="50" x2="340" y2="-30" stroke="#94a3b8" stroke-width="3"/>
    <rect x="315" y="-55" width="50" height="25" rx="4" fill="rgba(16,185,129,0.3)" stroke="#10b981" stroke-width="1.5"/>
    <text x="340" y="-40" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle" font-weight="700">WIND</text>
    <path d="M 320 -55 L 340 -70 L 360 -55" fill="none" stroke="#34d399" stroke-width="1.5"/>
    <text x="380" y="-45" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9.5">ULTRASONIC 2D PROBE (ABOVE PROP WASH)</text>
  </g>

  <!-- Bottom Spec Sheet -->
  <g transform="translate(60, 445)">
    <rect width="780" height="42" rx="6" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.1)"/>
    <text x="25" y="26" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">PAYLOAD WEIGHT: <tspan fill="#00f0ff">215g</tspan></text>
    <text x="240" y="26" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">SAMPLING DUCT: <tspan fill="#34d399">LAMINAR 3D-PRINTED</tspan></text>
    <text x="520" y="26" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">ISOLATION: <tspan fill="#f59e0b">VIBRATION DAMPENED</tspan></text>
  </g>
</svg>
