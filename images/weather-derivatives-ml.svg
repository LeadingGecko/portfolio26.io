<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="mlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f24"/>
      <stop offset="100%" stop-color="#030612"/>
    </linearGradient>
    <linearGradient id="ciCone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="payoffGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
  </defs>

  <rect width="900" height="520" fill="url(#mlBg)"/>

  <!-- Background decorative grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="320" x2="900" y2="320"/>
    <line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="520"/>
    <line x1="400" y1="0" x2="400" y2="520"/>
    <line x1="600" y1="0" x2="600" y2="520"/>
    <line x1="800" y1="0" x2="800" y2="520"/>
  </g>

  <!-- Header -->
  <rect x="25" y="20" width="850" height="475" rx="10" fill="none" stroke="rgba(139,92,246,0.3)" stroke-width="1.5"/>
  <text x="45" y="55" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" letter-spacing="2">QUANTITATIVE ML // HEATING DEGREE DAYS (HDD) PREDICTION &amp; PRICING</text>
  <text x="850" y="55" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">CME GROUP CONTRACT SPECIFICATION</text>
  <line x1="45" y1="68" x2="855" y2="68" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Left Main Chart: Historical + Forecast Cone -->
  <g transform="translate(45, 90)">
    <rect width="520" height="340" rx="8" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="28" fill="#e2e8f0" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">CUMULATIVE HDD INDEX vs PREDICTION CONE (95% CI)</text>
    
    <!-- Grid -->
    <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
      <line x1="60" y1="60" x2="490" y2="60"/>
      <line x1="60" y1="120" x2="490" y2="120"/>
      <line x1="60" y1="180" x2="490" y2="180"/>
      <line x1="60" y1="240" x2="490" y2="240"/>
      <line x1="140" y1="50" x2="140" y2="250"/>
      <line x1="220" y1="50" x2="220" y2="250"/>
      <line x1="300" y1="50" x2="300" y2="250"/>
      <line x1="380" y1="50" x2="380" y2="250"/>
      <line x1="460" y1="50" x2="460" y2="250"/>
    </g>

    <!-- Y-axis labels (Cumulative HDD) -->
    <text x="50" y="64" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end">1200</text>
    <text x="50" y="124" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end">900</text>
    <text x="50" y="184" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end">600</text>
    <text x="50" y="244" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end">300</text>

    <!-- X-axis labels (Days into contract) -->
    <text x="60" y="265" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">Day 0</text>
    <text x="140" y="265" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">Day 30</text>
    <text x="220" y="265" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">Day 60</text>
    <text x="300" y="265" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">T (Today)</text>
    <text x="380" y="265" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="9">Day 90</text>
    <text x="460" y="265" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="9">Maturity</text>

    <!-- Vertical Today Divider -->
    <line x1="300" y1="50" x2="300" y2="250" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- Historical Actuals Curve (Solid White/Cyan) -->
    <path d="M 60 230 Q 120 220, 140 195 T 220 155 T 300 135" fill="none" stroke="#00f0ff" stroke-width="2.5"/>

    <!-- Prediction Cone (95% CI shaded region) -->
    <path d="M 300 135 Q 380 110, 480 65 L 480 160 Q 380 145, 300 135 Z" fill="url(#ciCone)"/>

    <!-- Ensemble Mean Line (Dashed Violet) -->
    <path d="M 300 135 Q 380 125, 480 105" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-dasharray="5,4"/>

    <!-- Strike Price Line (Amber) -->
    <line x1="60" y1="120" x2="480" y2="120" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="480" y="115" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end">STRIKE (K = 900 HDD)</text>

    <!-- Legend -->
    <circle cx="80" cy="305" r="4" fill="#00f0ff"/>
    <text x="90" y="308" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9.5">Observed Actuals</text>
    <circle cx="210" cy="305" r="4" fill="#c084fc"/>
    <text x="220" y="308" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9.5">LSTM/Ensemble Forecast</text>
    <rect x="375" y="300" width="14" height="8" rx="2" fill="rgba(139,92,246,0.5)"/>
    <text x="395" y="308" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9.5">95% Monte Carlo CI</text>
  </g>

  <!-- Right Panel: Quantitative Metrics & Model Pipeline -->
  <g transform="translate(585, 90)">
    <!-- Fair Option Value -->
    <rect width="265" height="75" rx="8" fill="rgba(15,23,42,0.8)" stroke="rgba(168,85,247,0.3)"/>
    <text x="18" y="26" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">FAIR VALUE CALL OPTION</text>
    <text x="18" y="58" fill="#c084fc" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">$48,250 <tspan font-size="13" fill="#94a3b8">/ tick</tspan></text>
    <text x="185" y="42" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">▲ Vol +3.2%</text>

    <!-- Backtest Performance -->
    <rect y="88" width="265" height="75" rx="8" fill="rgba(15,23,42,0.8)" stroke="rgba(56,189,248,0.2)"/>
    <text x="18" y="114" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">TEMPERATURE RMSE / R²</text>
    <text x="18" y="146" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">1.18°C <tspan font-size="14" fill="#94a3b8">| R² 0.94</tspan></text>
    <text x="180" y="130" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="10">ECMWF ERA5</text>
    <text x="180" y="146" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9.5">30-Yr Daily</text>

    <!-- Payoff Distribution / VaR -->
    <rect y="176" width="265" height="75" rx="8" fill="rgba(15,23,42,0.8)" stroke="rgba(16,185,129,0.2)"/>
    <text x="18" y="202" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">PORTFOLIO VALUE AT RISK (99%)</text>
    <text x="18" y="234" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">-6.4% <tspan font-size="13" fill="#94a3b8">HEDGED</tspan></text>
    <text x="180" y="218" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">vs -24.8%</text>
    <text x="180" y="234" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">Unhedged Risk</text>

    <!-- Machine Learning Architecture Pipeline -->
    <rect y="265" width="265" height="75" rx="8" fill="rgba(15,23,42,0.8)" stroke="rgba(245,158,11,0.2)"/>
    <text x="18" y="290" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">STACK &amp; ARCHITECTURE</text>
    <text x="18" y="310" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">PyTorch LSTM + XGBoost</text>
    <text x="18" y="328" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9.5">Ornstein-Uhlenbeck + Monte Carlo (100k)</text>
  </g>

  <!-- Bottom Data Line -->
  <g transform="translate(45, 445)">
    <rect width="805" height="38" rx="6" fill="rgba(15,23,42,0.7)" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="24" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10.5">INGESTION: <tspan fill="#38bdf8">NOAA GHCN-Daily + ECMWF Reanalysis</tspan></text>
    <text x="380" y="24" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10.5">HORIZON: <tspan fill="#c084fc">90-Day Seasonal</tspan></text>
    <text x="610" y="24" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10.5">TARGET: <tspan fill="#10b981">Utility &amp; Energy Hedging</tspan></text>
  </g>
</svg>
